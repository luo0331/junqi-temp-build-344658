name: generate-tracking-demo

on:
  workflow_dispatch:

jobs:
  video:
    runs-on: macos-15
    env:
      GH_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
    steps:
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: luo0331/junqi-assistant-ios
          ref: fix/start-sequence-v71
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: private-src

      - name: Install Python dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install opencv-python-headless

      - name: Download source video
        working-directory: private-src
        run: |
          mkdir -p videos
          gh release download test-videos-v80-20260910 \
            --repo luo0331/junqi-assistant-ios \
            --pattern '4cfe64de4a8b54178995d439ada7ab0a.mp4' \
            --dir videos

      - name: Render annotated frames
        working-directory: private-src
        run: |
          ../.venv/bin/python tools/calibration_tracking_video.py \
            videos/4cfe64de4a8b54178995d439ada7ab0a.mp4 \
            tracking-frames

      - name: Install FFmpeg
        run: brew install ffmpeg

      - name: Encode tracking demo
        working-directory: private-src
        run: |
          ffmpeg \
            -y \
            -framerate 15 \
            -i tracking-frames/frame_%05d.jpg \
            -c:v libx264 \
            -pix_fmt yuv420p \
            calibration-tracking-demo.mp4

      - uses: actions/upload-artifact@v4
        with:
          name: calibration-tracking-demo
          path: private-src/calibration-tracking-demo.mp4
