name: build-private-ipa

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: luo0331/junqi-assistant-ios
          ref: fix/start-sequence-v71
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: private-src

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: private-src
        run: xcodegen generate

      - name: Normalize Xcode project format
        working-directory: private-src
        run: sed -i '' 's/objectVersion = 77;/objectVersion = 60;/g' JunqiAssistant.xcodeproj/project.pbxproj

      - name: Build unsigned app
        working-directory: private-src
        run: |
          xcodebuild \
            -project JunqiAssistant.xcodeproj \
            -scheme JunqiAssistant \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package encrypted IPA
        working-directory: private-src
        env:
          ARTIFACT_PASSWORD: ${{ secrets.ARTIFACT_PASSWORD }}
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/JunqiAssistant.app Payload/
          zip -P "$ARTIFACT_PASSWORD" -qr JunqiAssistant-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: JunqiAssistant-unsigned-ipa
          path: private-src/JunqiAssistant-unsigned.ipa
